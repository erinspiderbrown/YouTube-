<title>Abby Steiner Teleprompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a single-theme dark prompter. Thin top bar with part chips, one big reading column, a fixed control bar at the bottom. */
:root{
  --bg:#0b0d10; --panel:#14171c; --line:#262b33; --fg:#f3f1ec; --muted:#9aa1ab; --accent:#ff7a1a; --guide:rgba(255,122,26,.16);
  --read:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --size:44px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.top h1 b{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;font:600 13px var(--ui);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chip[aria-current="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.chip.done::after{content:" ✓";color:var(--accent)}
.chip[aria-current="true"].done::after{color:var(--bg)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;position:relative;scroll-behavior:auto}
.col{max-width:34ch;margin:0 auto;padding-block:30vh 60vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--read);font-size:var(--size);line-height:1.42}
.col .label{font:700 14px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.6em}
.col .file{font:500 13px var(--ui);color:var(--muted);margin-bottom:1.4em;letter-spacing:.02em}
.col p{margin:0 0 .9em;text-wrap:pretty}
.guide{position:fixed;left:0;right:0;top:38%;height:calc(var(--size)*1.5);background:var(--guide);border-block:1px solid rgba(255,122,26,.35);pointer-events:none;z-index:1}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:1.2em;font:400 15px/1.5 var(--ui);color:var(--muted)}
.help strong{color:var(--fg)}
.help ul{margin:.4em 0 0;padding-left:1.1em}
footer{background:var(--panel);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
footer button{font:700 15px var(--ui);color:var(--fg);background:#1c2027;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:44px}
footer button.go{background:var(--accent);border-color:var(--accent);color:#14100b;min-width:110px}
.grp{display:flex;align-items:center;gap:6px}
.grp span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.cue{font:600 15px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 1.2em}
footer button.rec{background:#c8102e;border-color:#c8102e;color:#fff;min-width:120px}
footer button.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.takes{max-width:34ch;margin:0 auto;font:400 14px var(--ui);color:var(--muted)}
#takes{background:var(--panel);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 13px var(--ui);color:var(--muted);max-height:30vh;overflow:auto}
#takes .take{display:flex;align-items:center;gap:6px;background:#1c2027;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
#takes audio{height:30px;max-width:200px}
#takes button{font:600 12px var(--ui);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer}
#status{color:var(--fg)}
@media (prefers-reduced-motion:reduce){footer button.rec.on{animation:none}}
@media (max-width:520px){:root{--size:32px}.guide{top:34%}}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
</style>

<header>
  <div class="top"><h1>The Downfall of <b>Abby Steiner</b></h1><span class="meta" id="meta"></span></div>
  <nav class="chips" id="chips" aria-label="Script parts"></nav>
</header>
<div class="guide" aria-hidden="true"></div>
<main id="main"><div class="col" id="col"></div></main>
<div id="takes" aria-live="polite"><span id="status">Takes for this part show up here.</span></div>
<footer>
  <button id="prev" aria-label="Previous part">◀</button>
  <div class="grp"><button id="slower" aria-label="Scroll slower">−</button><span id="spd">Speed 3</span><button id="faster" aria-label="Scroll faster">+</button></div>
  <button id="rec" class="rec">⬆ Add take</button><input id="pick" type="file" accept="audio/*,.m4a,.mp4,.webm,video/mp4,video/webm" hidden>
  <button id="play" class="go">▶ Scroll</button>
  <div class="grp"><button id="smaller" aria-label="Smaller text">A−</button><span id="sz">Text</span><button id="bigger" aria-label="Bigger text">A+</button></div>
  <button id="next" aria-label="Next part">▶</button>
</footer>
<script>
const SECS = [{"n": 1, "title": "Cold open", "paras": ["June 2022. Hayward Field.", "A white girl from Ohio lines up in the 200… against the fastest women in America.", "And she beat all of 'em.", "[SOUNDBITE: the 21.77 race call]", "21.77. US champion. At that moment, the fastest time in the whole world that year.", "4 weeks later she a 2-time world champion.", "2 years later… her career was basically over.", "Her name is Abby Steiner. This the downfall of Abby Steiner. And what went wrong."]}, {"n": 2, "title": "Why she was different", "paras": ["Now let's just keep it real.", "In sprinting today, the top of the women's 200 is mostly Black women. America. Jamaica. The Caribbean. That's just facts. Go look at any Olympic final.", "So when a white girl from Dublin, Ohio starts running with them… and beating them… people noticed.", "Y'all remember Matthew Boling. \"White Lightning.\" Same thing. The hype was different.", "And Abby? Abby actually backed it up."]}, {"n": 3, "title": "The soccer girl", "paras": ["And here go the crazy part. Track wasn't even her first sport.", "She was a soccer player. All-state forward.", "She ain't start running track till 8th grade. Then in high school she tore her ACL and missed most of a year.", "Came back anyway. 14 state titles.", "Kentucky gave her a scholarship for both. Soccer and track. Her freshman year she started 19 soccer games.", "Then she made a choice. No more soccer. Just track."]}, {"n": 4, "title": "The rise", "paras": ["2021. She win the NCAA indoor title in the 200.", "2022. She run 22.09 indoors. The American record.", "Then June 11, 2022. The NCAA outdoor final. 21.80.", "[SOUNDBITE: the 21.80 race call]", "The fastest a college woman has ever run the 200. Ever.", "2 weeks later, same track. US Championships. 21.77. She beat everybody.", "Then the World Championships. Same track again.", "5th in the 200. But in the relays? Gold in the 4x100. Gold in the 4x400.", "[SOUNDBITE: Abby after the relay gold]", "Then they gave her the Bowerman. The biggest award in college track. And PUMA signs her. Reportedly a 2 million dollar deal.", "She 22 years old. A 2-time world champion. The sky was the limit."]}, {"n": 5, "title": "The fall", "paras": ["2023 started good. She ran an American record indoors in the 300.", "But then… her heels.", "USAs 2023. She finish 4th in the 200. No individual spot at Worlds.", "Then her season got shut down early.", "August 2023, surgery on her left foot. September, surgery on her right foot.", "2024. Olympic year. She fight her way back to the Trials and make the 200 final.", "6th. No Paris.", "[SOUNDBITE: Abby crying after the Trials]", "Then her left foot started hurting again. Another surgery. At least 3 surgeries total.", "2025, she didn't run 1 race.", "August 2025, she posted it herself. She said she was \"taking a step back from running for the time being to give myself the time I need to get healthy.\""]}, {"n": 6, "title": "What went wrong", "paras": ["So what went wrong? Let's break it down.", "Number 1. 2022 was the longest season of her life.", "College indoors in the winter. College outdoors in the spring. USAs in June. Then Worlds in July. Prelims, semis, finals, relays. She was racing from January all the way to the end of July.", "At Worlds, after the relay gold, somebody asked her if she was finally done. She said, \"We'll be done after this meet.\"", "Number 2. Her heels.", "What she had is called Haglund's. That's a bone bump on the back of your heel that rubs on the Achilles. Every step, it's grinding.", "She had it in both feet. So both feet got surgery. Left foot in August. Right foot in September.", "Number 3. The clock.", "She told reporters at the Trials, the 1st time she even jogged on a track again was around the beginning of December.", "December. And the Olympic Trials is June. That's 6 months to go from surgery to trying to make the Olympic team. In the deepest sprint country in the world.", "Number 4. She trained through it.", "Right before the Trials, her foot started acting up again. And she said they \"thought it was best to train through\" it.", "Then after the Trials… the pain came back. Another surgery.", "And number 5. She blames her old spikes. She even took her shoe company to court over it. But that's a whole other video."]}, {"n": 7, "title": "Where she at now", "paras": ["So where Abby Steiner at now?", "Not on a track.", "She in grad school. University of South Carolina. Master's in exercise science.", "The girl who was the fastest college woman ever… is in a classroom.", "And think about this. Her 21.77 would've medaled in the Paris Olympic final. She was 22. Sprinters peak around 26, 27.", "She should be in her prime right now."]}, {"n": 8, "title": "So what y'all think?", "paras": ["Now I'ma keep it real with y'all.", "How often you see a white girl from Ohio running with the fastest women on the planet? And beating 'em?", "Abby did that. For 1 summer, she was as fast as anybody in the world.", "Then her body gave out.", "So what y'all think? Was it the season? The surgeries? Did she rush back?", "And if she stayed healthy… would Abby Steiner be an Olympic champion right now?", "Let me know in the comments."]}];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const fileName = s => `abby_${String(s.n).padStart(2,"0")}_${slug(s.title)}`;
const store = { get(k,d){try{const v=localStorage.getItem("as_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem("as_"+k,JSON.stringify(v))}catch(e){}} };
let cur = Math.min(store.get("cur",0), SECS.length-1), speed = store.get("speed",3), size = store.get("size",0);
let playing=false, raf=0, last=0, acc=0, lock=null;
let db=null, assets=null, downloads=null, takes=[], rec=null, chunks=[], t0=0, stream=null;
const $ = id => document.getElementById(id);
const main=$("main"), col=$("col");
const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function words(s){return s.paras.filter(p=>!p.startsWith("[")).join(" ").split(/\s+/).length}
function render(){
  const s=SECS[cur];
  const help = cur===0 ? `<div class="help"><strong>How to record</strong><ul>
    <li>Quiet room with soft things around you. A closet or a parked car works great.</li>
    <li>Start a new recording in your phone's voice memo app, then come back here and tap <strong>▶ Scroll</strong>. Hold the phone about 6 inches from your mouth.</li>
    <li>Read the part, stop the memo, then tap <strong>⬆ Add take</strong> and pick that recording. It saves here and I pick it up.</li>
    <li>Mess up? Pause, then say the line again. I cut the bad take.</li>
    <li>Re-record a part as many times as you want; I use the newest take. If a file won't add, send it in the chat instead.</li></ul></div>` : "";
  col.innerHTML = help + `<div class="label">Part ${s.n} of ${SECS.length} · ${s.title}</div><div class="file">Phone backup name: ${fileName(s)}</div>` +
    s.paras.map(p=> p.startsWith("[") ? `<div class="cue">${esc(p.replace(/^\[|\]$/g,""))} (don't read)</div>` : `<p>${esc(p)}</p>`).join("");
  main.scrollTop=0; acc=0;
  const doneParts=new Set(takes.map(t=>t.part));
  [...$("chips").children].forEach((c,i)=>{c.setAttribute("aria-current", i===cur ? "true":"false"); c.classList.toggle("done", doneParts.has(SECS[i].n));});
  $("chips").children[cur].scrollIntoView({block:"nearest",inline:"center"});
  const total=SECS.reduce((a,x)=>a+words(x),0);
  $("meta").textContent = `${words(s)} words · about ${Math.max(1,Math.round(words(s)/150*60))} s · whole script about ${Math.round(total/150)} min`;
  store.set("cur",cur); renderTakes();
}
function renderTakes(msg){
  const box=$("takes"); const mine=takes.filter(t=>t.part===SECS[cur].n).sort((a,b)=>b.at-a.at);
  const status = msg || (!db||!assets ? "Saving takes needs this page opened in Claude (signed in). You can still read and scroll." : mine.length ? `${mine.length} take${mine.length>1?"s":""} saved for this part (newest first). I use the newest.` : "No takes yet for this part.");
  box.innerHTML = `<span id="status">${esc(status)}</span>` + mine.map(t=>`<span class="take"><audio controls preload="none" src="/_blob/${t.asset}"></audio><span>${Math.round(t.secs||0)} s</span>${downloads?`<button data-save="${t.asset}">Save to phone</button>`:""}</span>`).join("");
}
$("takes").onclick=async e=>{ const id=e.target.dataset?.save; if(!id||!downloads) return;
  const t=takes.find(x=>x.asset===id); try{ const b=await (await fetch("/_blob/"+id)).blob(); await downloads.save({filename:`${fileName(SECS.find(s=>s.n===t.part))}.${(t.type||"").includes("mp4")?"m4a":"webm"}`, data:b}); }catch(err){ renderTakes("Couldn't save that file."); } };
function chips(){ $("chips").innerHTML = SECS.map((s,i)=>`<button class="chip" data-i="${i}">${s.n}. ${esc(s.title)}</button>`).join(""); $("chips").onclick=e=>{const b=e.target.closest(".chip"); if(b && !rec){stop(); cur=+b.dataset.i; render();}}; }
function applySize(){ const base = innerWidth<=520 ? 32 : 44; document.documentElement.style.setProperty("--size", (base + size*4) + "px"); $("sz").textContent = "Text " + (size>=0?"+":"") + size; store.set("size",size); }
function applySpeed(){ $("spd").textContent = "Speed " + speed; store.set("speed",speed); }
function tick(t){ if(!playing) return; const dt = last ? (t-last)/1000 : 0; last=t; acc += dt * (12 + speed*9); if(acc>=1){ const n=Math.floor(acc); main.scrollTop += n; acc-=n; } if(main.scrollTop+main.clientHeight >= main.scrollHeight-2){ stop(); return; } raf=requestAnimationFrame(tick); }
async function play(){ playing=true; last=0; $("play").textContent="❚❚ Pause"; raf=requestAnimationFrame(tick); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} }
function stop(){ playing=false; cancelAnimationFrame(raf); $("play").textContent="▶ Scroll"; try{ lock?.release(); }catch(e){} lock=null; }
async function addTake(file){
  if(!file) return;
  const part=SECS[cur].n, title=SECS[cur].title;
  if(!assets||!db){ renderTakes("Saving takes needs this page opened in Claude, signed in. Send the file in the chat instead."); return; }
  const name=(file.name||"").toLowerCase(), t=(file.type||"").toLowerCase();
  const kind = /webm/.test(t)||name.endsWith(".webm") ? "video/webm" : (/mp4|m4a|aac|quicktime/.test(t)||/\.(m4a|mp4|aac|mov)$/.test(name)) ? "video/mp4" : null;
  if(!kind){ renderTakes("That file type can't be stored here ("+(t||name||"unknown")+"). Send it in the chat instead."); return; }
  let secs=0; try{ secs=await new Promise(r=>{const a=new Audio(); a.preload="metadata"; a.onloadedmetadata=()=>r(isFinite(a.duration)?a.duration:0); a.onerror=()=>r(0); a.src=URL.createObjectURL(file);}); }catch(e){}
  renderTakes("Saving take…");
  try{
    const up=await assets.upload(file,{type:kind});
    await db.collection("takes").add({part, title, asset:up.id, type:kind, file:file.name||"", secs:Math.round(secs*10)/10, at:Date.now()});
    renderTakes(`Saved${secs?` (${Math.round(secs)} s)`:""}. Next part when you're ready.`);
  }catch(e){ renderTakes("Couldn't save that file ("+(e?.code||"error")+"). Send it in the chat instead."); }
}
$("pick").onchange=e=>{ const f=e.target.files?.[0]; e.target.value=""; addTake(f); };
$("rec").onclick=()=> $("pick").click();
$("play").onclick=()=> playing?stop():play();
$("prev").onclick=()=>{ if(cur>0 && !rec){stop();cur--;render();} };
$("next").onclick=()=>{ if(cur<SECS.length-1 && !rec){stop();cur++;render();} };
$("faster").onclick=()=>{ speed=Math.min(10,speed+1); applySpeed(); };
$("slower").onclick=()=>{ speed=Math.max(1,speed-1); applySpeed(); };
$("bigger").onclick=()=>{ size=Math.min(6,size+1); applySize(); };
$("smaller").onclick=()=>{ size=Math.max(-4,size-1); applySize(); };
addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return;
  if(e.code==="Space"){e.preventDefault(); playing?stop():play();}
  else if(e.key==="ArrowRight"){ $("next").click(); } else if(e.key==="ArrowLeft"){ $("prev").click(); }
  else if(e.key==="ArrowUp"){ $("faster").click(); } else if(e.key==="ArrowDown"){ $("slower").click(); } });
addEventListener("resize",applySize);
main.addEventListener("wheel",()=>{ if(playing && !rec) stop(); },{passive:true});
main.addEventListener("touchstart",()=>{ if(playing && !rec) stop(); },{passive:true});
chips(); applySize(); applySpeed(); render();
(async()=>{
  try{ downloads = await window.claude?.use("downloads"); }catch(e){}
  try{ assets = await window.claude?.use("assets"); }catch(e){}
  try{ db = await window.claude?.use("db"); }catch(e){}
  if(db){ db.collection("takes").onSnapshot(s=>{ takes=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>renderTakes("Couldn't load saved takes.")); }
  else renderTakes();
})();
</script>
