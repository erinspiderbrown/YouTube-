<title>Boling Teleprompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a single-theme dark prompter. Thin top bar with part chips, one big reading column, a fixed control bar at the bottom. */
:root{
  --bg:#0b0d10; --panel:#14171c; --line:#262b33; --fg:#f3f1ec; --muted:#9aa1ab; --accent:#ff7a1a; --guide:rgba(255,122,26,.16);
  --read:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --size:44px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.top h1 b{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;font:600 13px var(--ui);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chip[aria-current="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.chip.done::after{content:" ✓";color:var(--accent)}
.chip[aria-current="true"].done::after{color:var(--bg)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;position:relative;scroll-behavior:auto}
.col{max-width:34ch;margin:0 auto;padding-block:30vh 60vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--read);font-size:var(--size);line-height:1.42}
.col .label{font:700 14px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.6em}
.col .file{font:500 13px var(--ui);color:var(--muted);margin-bottom:1.4em;letter-spacing:.02em}
.col p{margin:0 0 .9em;text-wrap:pretty}
.guide{position:fixed;left:0;right:0;top:38%;height:calc(var(--size)*1.5);background:var(--guide);border-block:1px solid rgba(255,122,26,.35);pointer-events:none;z-index:1}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:1.2em;font:400 15px/1.5 var(--ui);color:var(--muted)}
.help strong{color:var(--fg)}
.help ul{margin:.4em 0 0;padding-left:1.1em}
footer{background:var(--panel);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
footer button{font:700 15px var(--ui);color:var(--fg);background:#1c2027;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:44px}
footer button.go{background:var(--accent);border-color:var(--accent);color:#14100b;min-width:110px}
.grp{display:flex;align-items:center;gap:6px}
.grp span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:520px){:root{--size:32px}.guide{top:34%}}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
</style>

<header>
  <div class="top"><h1>The Downfall of <b>Matthew Boling</b></h1><span class="meta" id="meta"></span></div>
  <nav class="chips" id="chips" aria-label="Script parts"></nav>
</header>
<div class="guide" aria-hidden="true"></div>
<main id="main"><div class="col" id="col"></div></main>
<footer>
  <button id="prev" aria-label="Previous part">◀</button>
  <div class="grp"><button id="slower" aria-label="Scroll slower">−</button><span id="spd">Speed 3</span><button id="faster" aria-label="Scroll faster">+</button></div>
  <button id="play" class="go">▶ Scroll</button>
  <div class="grp"><button id="smaller" aria-label="Smaller text">A−</button><span id="sz">Text</span><button id="bigger" aria-label="Bigger text">A+</button></div>
  <button id="donebtn" aria-label="Mark this part recorded">✓ Recorded</button>
  <button id="next" aria-label="Next part">▶</button>
</footer>

<script>
const SECS = [{"n": 1, "title": "Cold open", "paras": ["April twenty-seventh, twenty nineteen. Houston, Texas. A high school regional meet.", "A senior from Strake Jesuit lines up in the hundred… and runs nine ninety-eight.", "Nine ninety-eight. In high school.", "Now the wind was way over the legal limit, so it don't count as a record. But it ain't matter. By the next morning that clip was everywhere. ESPN, CBS, Fox, Sports Illustrated. Everybody callin' him \"White Lightning.\" People sayin' he the next Usain Bolt.", "His name was Matthew Boling.", "And seven years later, ain't nobody talkin' 'bout him like that. So what happened?"]}, {"n": 2, "title": "The hype was real", "paras": ["Now first, let's get one thing straight. This kid was not a fluke.", "That same season, at the Texas state meet, he run ten thirteen. Legal wind. That's the U S high school record.", "He won the long jump too. He was jumpin' twenty-six feet.", "And then he anchor the four-by-four. He get the stick over twenty meters behind… and run a forty-four seventy-four split to win it. In high school.", "He won Gatorade National Athlete of the Year. And that summer at the Pan Am U-twenty Championships, he took four gold medals. Hundred, two hundred, and both relays, and both relays set world U-twenty records.", "Oh, and the nickname? He said he ain't even like it. He didn't want his race being the story. He just wanted to run.", "So he committed to Georgia. And everybody figured this the start of somethin' crazy."]}, {"n": 3, "title": "Georgia", "paras": ["His first year at Georgia, COVID shut the whole season down.", "Twenty twenty-one, he come back and win the N C double-A indoor title in the two hundred. Twenty point one nine. And for a minute, it look like the hype was right on schedule.", "Then the Olympic Trials.", "He go out in the semis of the hundred. Fourteenth. And in the two hundred? Ninth. One spot. One spot from the final.", "That was the first time it hit. This ain't high school no more."]}, {"n": 4, "title": "He actually got faster", "paras": ["And here go the part people forget.", "Twenty twenty-two, he run nine ninety-eight again. Except this time? Legal wind. And a couple weeks later he run nineteen ninety-two in the two hundred.", "He won the S E C in the two hundred, took second at N C double-A.", "So he ain't slow. He a sub-ten, sub-twenty sprinter.", "But at U S A's? Sixth. And in America, sixth don't make the team. You can be top ten in the world in the two hundred and still be stayin' home, 'cause the U S is just that deep."]}, {"n": 5, "title": "The switch", "paras": ["Twenty twenty-three. He win the indoor N C double-A title in the two hundred again.", "But outdoors, he don't even make the final.", "So he try somethin' different. The four hundred.", "At U S A's he finish sixth again. But this time it got him on the relay pool for Worlds in Budapest.", "And mane… he ran the third leg of the mixed four-by-four. Gold medal. World record.", "He ran the heat of the men's four-by-four too, and they won that. So on paper? Matthew Boling a two-time world champion.", "That September he leave Georgia, skip his last year, and go pro. Moves to South Carolina to train with Alleyne Francique. Sayin' he wanna be on the world stage."]}, {"n": 6, "title": "Paris", "paras": ["Twenty twenty-four. The Olympic year. This the one everybody been waitin' on since that video in twenty nineteen.", "He run forty-four eighty-four in the four hundred. That's a P R. He get a World Indoor silver on the relay, and a World Relays gold.", "Then the Trials.", "In the four hundred, he make the final… and finish eighth. Last.", "In the two hundred? Ninth again. No final.", "And they don't pick him for the relay.", "No Paris."]}, {"n": 7, "title": "Now", "paras": ["Twenty twenty-five, he show up at Grand Slam Track in Philly. Seventh in the two hundred, twenty eighty-seven. Fifth in the four.", "This year he ran forty-five fifty-one in the four hundred.", "The kid that ran nine ninety-eight at eighteen, his best hundred today is still nine ninety-eight."]}, {"n": 8, "title": "So is it really a downfall?", "paras": ["Now I'ma keep it real with y'all.", "Matthew Boling a two-time world champion. He ran sub-ten and sub-twenty. Most people who ever put on spikes would kill for that career.", "But that ain't what we was promised. We was promised the next Usain Bolt. And that's the problem.", "He went viral at eighteen off a time that wasn't even legal. Before he ever ran a college race, the whole internet already decided what he was supposed to be. And everything after that got measured against one clip with a four-point-two tailwind.", "And the U S? It's the hardest team in the world to make. Sixth in America can be top ten in the world. But it still mean you stayin' home.", "So was it a downfall? Or was the hype just too big for anybody?", "Let me know in the comments. And if you was on the Boling hype train in twenty nineteen… be honest."]}];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const fileName = s => `boling_${String(s.n).padStart(2,"0")}_${slug(s.title)}`;
const store = { get(k,d){try{const v=localStorage.getItem("bp_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem("bp_"+k,JSON.stringify(v))}catch(e){}} };
let cur = Math.min(store.get("cur",0), SECS.length-1), speed = store.get("speed",3), size = store.get("size",0), done = new Set(store.get("done",[]));
let playing=false, raf=0, last=0, acc=0, lock=null;
const $ = id => document.getElementById(id);
const main=$("main"), col=$("col");
function words(s){return s.paras.join(" ").split(/\s+/).length}
function render(){
  const s=SECS[cur];
  const help = cur===0 ? `<div class="help"><strong>How to record</strong><ul>
    <li>Quiet room with soft things around you. A closet or a parked car works great.</li>
    <li>Phone voice memo app, mic about 6 inches from your mouth.</li>
    <li>One memo per part. Name it like the grey label under each title.</li>
    <li>Mess up? Pause, then say the line again. The bad take gets cut.</li>
    <li>Send the memos in the chat, or drop them in your Dropbox.</li></ul></div>` : "";
  col.innerHTML = help + `<div class="label">Part ${s.n} of ${SECS.length} · ${s.title}</div><div class="file">Save as: ${fileName(s)}</div>` + s.paras.map(p=>`<p>${p.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</p>`).join("");
  main.scrollTop=0; acc=0;
  [...$("chips").children].forEach((c,i)=>{c.setAttribute("aria-current", i===cur ? "true":"false"); c.classList.toggle("done", done.has(i));});
  $("chips").children[cur].scrollIntoView({block:"nearest",inline:"center"});
  const total=SECS.reduce((a,x)=>a+words(x),0);
  $("meta").textContent = `${words(s)} words · about ${Math.max(1,Math.round(words(s)/150*60))} s · whole script about ${Math.round(total/150)} min`;
  $("donebtn").textContent = done.has(cur) ? "✓ Recorded" : "Mark recorded";
  store.set("cur",cur);
}
function chips(){ $("chips").innerHTML = SECS.map((s,i)=>`<button class="chip" data-i="${i}">${s.n}. ${s.title}</button>`).join(""); $("chips").onclick=e=>{const b=e.target.closest(".chip"); if(b){stop(); cur=+b.dataset.i; render();}}; }
function applySize(){ const base = innerWidth<=520 ? 32 : 44; document.documentElement.style.setProperty("--size", (base + size*4) + "px"); $("sz").textContent = "Text " + (size>=0?"+":"") + size; store.set("size",size); }
function applySpeed(){ $("spd").textContent = "Speed " + speed; store.set("speed",speed); }
function tick(t){ if(!playing) return; const dt = last ? (t-last)/1000 : 0; last=t; acc += dt * (12 + speed*9); if(acc>=1){ const n=Math.floor(acc); main.scrollTop += n; acc-=n; } if(main.scrollTop+main.clientHeight >= main.scrollHeight-2){ stop(); return; } raf=requestAnimationFrame(tick); }
async function play(){ playing=true; last=0; $("play").textContent="❚❚ Pause"; raf=requestAnimationFrame(tick); try{ lock = await navigator.wakeLock?.request("screen"); }catch(e){} }
function stop(){ playing=false; cancelAnimationFrame(raf); $("play").textContent="▶ Scroll"; try{ lock?.release(); }catch(e){} lock=null; }
$("play").onclick=()=> playing?stop():play();
$("prev").onclick=()=>{ if(cur>0){stop();cur--;render();} };
$("next").onclick=()=>{ if(cur<SECS.length-1){stop();cur++;render();} };
$("faster").onclick=()=>{ speed=Math.min(10,speed+1); applySpeed(); };
$("slower").onclick=()=>{ speed=Math.max(1,speed-1); applySpeed(); };
$("bigger").onclick=()=>{ size=Math.min(6,size+1); applySize(); };
$("smaller").onclick=()=>{ size=Math.max(-4,size-1); applySize(); };
$("donebtn").onclick=()=>{ done.has(cur)?done.delete(cur):done.add(cur); store.set("done",[...done]); render(); };
addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return;
  if(e.code==="Space"){e.preventDefault(); playing?stop():play();}
  else if(e.key==="ArrowRight"){ $("next").click(); } else if(e.key==="ArrowLeft"){ $("prev").click(); }
  else if(e.key==="ArrowUp"){ $("faster").click(); } else if(e.key==="ArrowDown"){ $("slower").click(); } });
addEventListener("resize",applySize);
main.addEventListener("wheel",()=>{ if(playing) stop(); },{passive:true});
main.addEventListener("touchstart",()=>{ if(playing) stop(); },{passive:true});
chips(); applySize(); applySpeed(); render();
</script>
